name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        env:
          ALT_TAB_VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/make-app-bundle.sh

      - name: Package zip (preserves executable bit)
        run: |
          cd build
          ditto -c -k --keepParent "AltTab Dev.app" "AltTab-Dev-${{ steps.version.outputs.version }}.zip"

      - name: Smoke test the bundle
        run: |
          "build/AltTab Dev.app/Contents/MacOS/AltTab" --dump
          codesign --verify "build/AltTab Dev.app" || echo "(ad-hoc signature verify skipped)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/AltTab-Dev-${{ steps.version.outputs.version }}.zip" \
            --title "AltTab Dev ${{ steps.version.outputs.version }}" \
            --notes-file .github/release-notes-template.md \
            --draft=false --prerelease=false
